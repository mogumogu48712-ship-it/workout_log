const KEY="workout_complete_v2",HKEY="workout_history_complete_v2";
let state=null,view="home",timerEnd=null,tick=null,modal={id:null,set:0,rpe:null},open={};
const $=x=>document.getElementById(x);
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function load(){try{state=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){state=null}}
function save(){if(state)localStorage.setItem(KEY,JSON.stringify(state))}
function hist(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]")}catch(e){return[]}}
function dayKey(){return state?.week&&state?.day?`${state.week}/${state.day}`:""}
function targetText(e){return `${e.intensity||""}${e.intensity&&e.rpe?" / ":""}${e.rpe?"RPE "+e.rpe:""}`}
function start(week="W1",day="D1"){state={week,day,startedAt:Date.now(),completed:false,results:{},notes:{session:""}};save();render("training")}
function current(){return PROGRAM.PPP[state.week]?.[state.day]||[]}
function result(id,i){return state?.results?.[id]?.[i]||{}}
function idFor(e,i){return e.name+"__"+i}
function render(v=view){view=v;$("title").textContent=v==="home"?"":v==="training"?`${state.week} ${state.day}`:({history:"履歴",schedule:"予定",bbb:"BBB",settings:"設定"}[v]||"Workout");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));({home,training,historyView,schedule,bbb,settings}[v]||home)($("main"));timerUI()}
function home(m){m.innerHTML=`<div class="hero"><h1>Workout Log</h1><p>${state&&!state.completed?state.week+" "+state.day+" 進行中":"プログラム目標から開始"}</p><button class="btn" onclick="${state&&!state.completed?"render('training')":"start()"}">${state&&!state.completed?"続きから":"トレーニング開始"}</button></div>`}
function training(m){let a=current();if(!a.length){m.innerHTML=`<div class="card"><div class="body">この日は休養日またはTEST専用日です。</div></div>`;return}m.innerHTML=a.map((e,ei)=>exercise(e,ei)).join("")+`<div class="card"><div class="body"><label class="muted">セッション注釈</label><textarea id="sn" class="input" rows="3" oninput="state.notes.session=this.value;save()">${esc(state.notes.session||"")}</textarea><button class="btn" style="width:100%;margin-top:10px" onclick="finish()">トレーニング終了</button></div></div>`}
function exercise(e,ei){let id=e.name,op=open[id]!==false;let total=e.sets;let rows="";for(let i=0;i<total;i++){let t=e,reps=e.reps,r=result(id,i);rows+=setRow(id,i,t,reps)}return `<section class="card"><div class="cardhead" onclick="toggle('${esc(id)}')"><span>${op?"▼":"▶"} ${esc(id)}</span><span class="tag">${esc(targetText(e))}</span></div>${op?`<div class="body"><div class="muted">目標：${esc(e.reps)} rep / ${esc(e.intensity||"当日調整")} ${e.rpe?" / "+esc(e.rpe):""}${e.grip?" / "+esc(e.grip):""}</div>${rows}<div class="muted" style="padding:9px 0">種目注釈：${esc(e.note||"")}</div></div>`:""}</section>`}
function setRow(id,i,e,reps){let r=result(id,i),done=!!r.done,w=r.weight!=null?r.weight:(e.intensity||"—"),rp=r.reps!=null?r.reps:reps,rr=r.rpe!=null?r.rpe:(e.rpe||"");return `<div class="set ${done?"done":""}"><button class="cell" onclick="toggleDone('${esc(id)}',${i})">${done?"☑":"☐"}</button><button class="cell" onclick="edit('${esc(id)}',${i})">${esc(w)}<small class="muted">${r.weight!=null?" 実績kg":" 目標"}</small></button><button class="cell" onclick="edit('${esc(id)}',${i})">${esc(rp)} rep${rr!==""?" / @"+esc(rr):""}</button><span class="tag">SET ${i+1}</span></div>`}
function toggle(id){open[id]=open[id]===false;render("training")}
function toggleDone(id,i){state.results[id]??={};state.results[id][i]??={};state.results[id][i].done=!state.results[id][i].done;save();if(state.results[id][i].done)startTimer(180);render("training")}
function edit(id,i){let r=result(id,i),e=current().find(x=>x.name===id);modal={id,set:i,rpe:r.rpe??null};$("sheet").innerHTML=`<h3>${esc(id)} / SET ${i+1}</h3><label>重量 kg</label><input id="mw" class="input" type="number" step=".1" value="${r.weight??""}" placeholder="実施重量"><label>レップ</label><input id="mr" class="input" type="number" min="0" step="1" value="${r.reps??""}" placeholder="${esc(e.reps)}"><label>RPE</label><div class="rpes">${Array.from({length:10},(_,n)=>`<button type="button" class="${modal.rpe===n+1?"sel":""}" onclick="pickRPE(${n+1},this)">${n+1}</button>`).join("")}</div><button class="btn" style="width:100%" onclick="saveEdit()">実績を保存</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="closeModal()">キャンセル</button>`;$("modal").classList.remove("hidden")}
function pickRPE(n,b){modal.rpe=n;document.querySelectorAll(".rpes button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")}
function saveEdit(){state.results[modal.id]??={};state.results[modal.id][modal.set]={...(state.results[modal.id][modal.set]||{}),weight:$("mw").value===""?null:Number($("mw").value),reps:$("mr").value===""?null:Number($("mr").value),rpe:modal.rpe};save();closeModal();render("training")}
function closeModal(){$("modal").classList.add("hidden")}
function startTimer(sec){timerEnd=Date.now()+sec*1000;clearInterval(tick);tick=setInterval(timerUI,500);timerUI()}
function timerUI(){let t=$("timer");if(!timerEnd){t.classList.add("hidden");return}let ms=Math.max(0,timerEnd-Date.now());if(ms===0){timerEnd=null;clearInterval(tick);t.classList.add("hidden");try{navigator.vibrate?.([180,80,180]);new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=").play()}catch(e){}return}t.classList.remove("hidden");t.textContent=`休憩 ${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,"0")}`+"  +30 −30 ↺"}
function finish(){state.completed=true;state.finishedAt=Date.now();let h=hist();h.unshift(JSON.parse(JSON.stringify(state)));localStorage.setItem(HKEY,JSON.stringify(h));save();render("home")}
function historyView(m){let h=hist();if(!h.length){m.innerHTML=`<div class="card"><div class="body">履歴はまだありません。</div></div>`;return}let groups={};h.forEach(x=>{let d=new Date(x.finishedAt||x.startedAt),k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;(groups[k]??=[]).push(x)});m.innerHTML=Object.entries(groups).map(([mo,arr])=>`<section class="card"><div class="cardhead">${mo}<span>${arr.length}件</span></div><div class="body">${arr.map((x,i)=>`<div class="item" onclick="historyDetail(${h.indexOf(x)})"><b>${new Date(x.finishedAt||x.startedAt).toLocaleDateString("ja-JP")}</b>　${esc(x.week)} ${esc(x.day)}</div>`).join("")}</div></section>`).join("")}
function historyDetail(i){let x=hist()[i];let html=`<h3>${new Date(x.finishedAt||x.startedAt).toLocaleDateString("ja-JP")} ${x.week} ${x.day}</h3>`;Object.entries(x.results||{}).forEach(([name,sets])=>{html+=`<div class="card"><div class="cardhead">${esc(name)}</div><div class="body">${Object.entries(sets).map(([n,r])=>`<div class="item">SET ${Number(n)+1}：${r.weight??"—"} kg × ${r.reps??"—"}${r.rpe?" @"+r.rpe:""} ${r.done?"✓":""}</div>`).join("")}</div></div>`});html+=`<button class="btn danger" onclick="deleteHistory(${i})">この履歴を削除</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="closeModal()">閉じる</button>`;$("sheet").innerHTML=html;$("modal").classList.remove("hidden")}
function deleteHistory(i){if(confirm("この履歴を完全に削除しますか？")){let h=hist();h.splice(i,1);localStorage.setItem(HKEY,JSON.stringify(h));closeModal();render("history")}}
function schedule(m){let ws=Object.keys(PROGRAM.PPP);m.innerHTML=`<h2>予定</h2>`+ws.map(w=>`<section class="card"><div class="cardhead">${w}</div><div class="body">${Object.keys(PROGRAM.PPP[w]).map(d=>`<div class="item"><b>${d}</b>　${PROGRAM.PPP[w][d].length}種目 <button class="btn secondary" style="float:right;padding:7px 10px" onclick="start('${w}','${d}')">開始</button></div>`).join("")}</div></section>`).join("")}
function bbb(m){let all=[];Object.entries(PROGRAM.BBB).forEach(([cat,arr])=>arr.forEach(x=>all.push({cat,name:x[0],sets:x[1],reps:x[2]})));m.innerHTML=`<h2>BBB</h2><input class="input" placeholder="種目検索" oninput="filterBBB(this.value)"><div id="bbblist" class="card" style="margin-top:10px">${all.map(x=>`<div class="item" data-n="${esc(x.name.toLowerCase())}"><b>${esc(x.name)}</b><div class="muted">${esc(x.cat)} / ${x.sets}セット / ${esc(x.reps)} rep</div></div>`).join("")}</div>`}
function filterBBB(q){q=q.toLowerCase();document.querySelectorAll("#bbblist .item").forEach(x=>x.style.display=x.dataset.n.includes(q)?"block":"none")}
function settings(m){m.innerHTML=`<h2>設定</h2><div class="card"><div class="item">自動保存：ON</div><div class="item">RPE：1〜10選択式</div><div class="item">通常セット完了：自動レスト</div><div class="item"><button class="btn secondary" onclick="backup()">バックアップ書き出し</button></div><div class="item"><button class="btn danger" onclick="clearSession()">進行中セッション削除</button></div></div>`}
function backup(){let blob=new Blob([JSON.stringify({program:PROGRAM,session:state,history:hist()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="workout-backup.json";a.click();URL.revokeObjectURL(a.href)}
function clearSession(){if(confirm("進行中セッションを削除しますか？")){state=null;localStorage.removeItem(KEY);render("home")}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>render(b.dataset.v));load();render();
</script></body></html>
