<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workout Log</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f6;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input{font:inherit}button{border:0;background:none;color:inherit}.hidden{display:none!important}
#app{min-height:100vh;padding-bottom:76px}.top{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:10}
#title{font-weight:700}.top .left,.top .right{position:absolute;width:44px;height:44px;display:grid;place-items:center;font-size:28px}.top .left{left:8px}.top .right{right:8px}
main{max-width:760px;margin:auto;padding:12px}.hero{text-align:center;padding:75px 12px 80px}.hero .date{font-size:34px;font-weight:750}.hero .wd{font-size:18px;color:#666;margin-top:5px}
.primary{background:#111;color:#fff;border-radius:12px;padding:14px 18px;font-weight:700}.hero .primary{margin-top:38px;width:min(340px,100%)}
.section{background:#fff;border:1px solid #ddd;border-radius:13px;margin:9px 0;overflow:hidden}.head{padding:14px;display:flex;align-items:center;justify-content:space-between;font-weight:700}.body{padding:0 12px 12px}.muted{font-size:12px;color:#777}
.row{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:7px;align-items:center;border-top:1px solid #eee;padding:9px 0}.check{font-size:22px}.cell{background:#f1f1f1;border-radius:8px;padding:9px;text-align:center;min-height:38px}.done{opacity:.52}.tag{font-size:10px;background:#eee;border-radius:6px;padding:5px;text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav button{font-size:11px;color:#666}.nav button.on{color:#111;font-weight:700}
.timer{position:fixed;right:13px;bottom:89px;background:#111;color:#fff;border-radius:18px;padding:8px 12px;font-variant-numeric:tabular-nums;z-index:30}
.list{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden}.list .item{padding:15px;border-bottom:1px solid #eee}.list .item:last-child{border-bottom:0}
.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;background:#fff}.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:9px 0}.rpe button{padding:11px;border:1px solid #ccc;border-radius:8px}.rpe button.sel{background:#111;color:#fff}
.modal{position:fixed;inset:0;background:#0005;z-index:50;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}.sheet label{display:block;font-size:12px;color:#666;margin:8px 0 4px}
.smallbtn{border:1px solid #ccc;border-radius:9px;padding:9px;background:#fff}.danger{color:#b00020}.empty{text-align:center;color:#777;padding:50px 10px}
</style>
</head>
<body>
<div id="app">
<header class="top">
<button class="left hidden" id="back">‹</button>
<div id="title"></div>
<button class="right" id="more">⋯</button>
</header>
<main id="main"></main>
<div id="timer" class="timer hidden">0:00</div>
<nav class="nav">
<button data-v="home">HOME</button><button data-v="history">履歴</button><button data-v="schedule">予定</button><button data-v="bbb">BBB</button><button data-v="settings">設定</button>
</nav>
</div>
<div id="modal" class="modal hidden"><div class="sheet"><div id="sheet"></div><button class="primary" style="width:100%;margin-top:12px" onclick="closeModal()">閉じる</button></div></div>

<script>
const EMBEDDED_PROGRAM = {"program": {"id": "example_program_v1", "name": "UI展開テスト用サンプル", "version": "1.0", "weeks": [{"week": 1, "days": [{"day": 1, "label": "D1", "exercises": [{"id": "squat", "name": "Squat", "structure": "normal", "rest_seconds": 180, "sets": [{"set": 1, "target": {"weight": 100, "reps": 5, "rpe": 8}}, {"set": 2, "target": {"weight": 105, "reps": 5, "rpe": 8}}, {"set": 3, "target": {"weight": 110, "reps": 5, "rpe": 8}}]}, {"id": "bench", "name": "Bench Press", "structure": "ascending", "rest_seconds": 150, "sets": [{"set": 1, "target": {"weight": 80, "reps": 8, "rpe": 7}}, {"set": 2, "target": {"weight": 85, "reps": 6, "rpe": 8}}, {"set": 3, "target": {"weight": 90, "reps": 4, "rpe": 9}}]}, {"id": "row", "name": "Row", "structure": "drop", "rest_seconds": 120, "main": {"target": {"weight": 80, "reps": 8, "rpe": 9}}, "drops": [{"target": {"weight": 60, "reps": 8}}, {"target": {"weight": 40, "reps": 10}}]}, {"id": "superset_a", "name": "SUPERSET A", "structure": "superset", "rest_seconds": 0, "exercises": [{"id": "curl", "name": "Curl", "sets": [{"set": 1, "target": {"weight": 20, "reps": 10, "rpe": 8}}, {"set": 2, "target": {"weight": 20, "reps": 10, "rpe": 8}}]}, {"id": "extension", "name": "Triceps Extension", "sets": [{"set": 1, "target": {"weight": 25, "reps": 10, "rpe": 8}}, {"set": 2, "target": {"weight": 25, "reps": 10, "rpe": 8}}]}]}]}]}]}, "bbb": {"exercise_master": [{"id": "hack_squat", "name": "Hack Squat", "category": "legs", "tags": ["quad", "machine"]}, {"id": "leg_press", "name": "Leg Press", "category": "legs", "tags": ["quad", "machine"]}, {"id": "belt_squat", "name": "Belt Squat", "category": "legs", "tags": ["quad", "machine"]}], "schedule": [{"slot": "legs", "candidates": ["hack_squat", "leg_press", "belt_squat"]}]}};
const SKEY="workout_session_v2", HKEY="workout_history_v2";
let data=EMBEDDED_PROGRAM, view="home", session=null, openMap={}, timerEnd=null, timerTick=null, modalRPE=null;

const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function save(){if(session)localStorage.setItem(SKEY,JSON.stringify(session))}
function loadSaved(){try{session=JSON.parse(localStorage.getItem(SKEY)||"null")}catch{session=null}}
function history(){try{return JSON.parse(localStorage.getItem(HKEY)||"[]")}catch{return[]}}
function day(){return data.program.weeks[0].days[0]}
function dateText(){const d=new Date();return `${d.getMonth()+1}/${d.getDate()}`}
function setTitle(){ $("title").textContent=view==="home"?`${dateText()}  W${data.program.weeks[0].week} D${day().day}`:({training:`W${data.program.weeks[0].week} D${day().day}`,history:"履歴",schedule:"予定",bbb:"BBB",settings:"設定"}[view]||"Workout"); $("back").classList.toggle("hidden",view==="home"); document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view))}
function render(v=view){view=v;setTitle();({home:home,training:training,history:historyView,schedule:schedule,bbb:bbb,settings:settings}[view]||home)($("main"));timerUpdate()}
function home(m){m.innerHTML=`<div class="hero"><div class="date">${dateText()}</div><div class="wd">W${data.program.weeks[0].week} D${day().day}</div><button class="primary" onclick="${session&&!session.completed?"render('training')":"start()"}">${session&&!session.completed?"トレーニングへ戻る":"トレーニング開始"}</button></div>`}
function start(){if(!session||session.completed)session={startedAt:Date.now(),completed:false,results:{}};save();render("training")}
function target(t){return `${t.weight??"—"} kg × ${t.reps??"—"}${t.rpe!=null?" @"+t.rpe:""}`}
function result(id,i){return session?.results?.[id]?.[i]||{}}
function setRow(id,i,t,label){let r=result(id,i),done=!!r.done;return `<div class="row ${done?"done":""}"><button class="check" onclick="complete('${id}',${i})">${done?"☑":"☐"}</button><button class="cell" onclick='edit("${id}",${i},${JSON.stringify(t)})'>${r.weight!=null?esc(r.weight):esc(t.weight??"—")} kg<small class="muted">${r.weight!=null?"実績":"目標"}</small></button><button class="cell" onclick='edit("${id}",${i},${JSON.stringify(t)})'>${r.reps!=null?esc(r.reps):esc(t.reps??"—")} rep${r.rpe!=null?" / @"+r.rpe:(t.rpe!=null?" / @"+t.rpe:"")}<small class="muted">${r.reps!=null||r.rpe!=null?"実績":"目標"}</small></button><span class="tag">${label}</span></div>`}
function exercise(e){
 let open=openMap[e.id]!==false, body="";
 if(e.structure==="normal"||e.structure==="ascending")body=e.sets.map((s,i)=>setRow(e.id,i,s.target,"SET "+(i+1))).join("");
 if(e.structure==="drop")body=setRow(e.id,0,e.main.target,"MAIN")+e.drops.map((s,i)=>setRow(e.id,i+1,s.target,"DROP")).join("");
 if(e.structure==="superset")body=e.exercises.map(x=>`<div class="section"><div class="head">${esc(x.name)}</div><div class="body">${x.sets.map((s,i)=>setRow(e.id+"_"+x.id,i,s.target,"SET "+(i+1))).join("")}</div></div>`).join("");
 return `<section class="section"><div class="head" onclick="toggle('${e.id}')"><span>${open?"▼":"▶"} ${esc(e.name)}</span><span class="tag">${e.structure}</span></div>${open?`<div class="body"><div class="muted" style="padding:4px 0 9px">目標：プログラム値　／　前回値：別枠</div>${body}<div class="muted" style="padding:10px 0">注釈 ＋</div></div>`:""}</section>`
}
function training(m){m.innerHTML=day().exercises.map(exercise).join("")+`<button class="primary" style="width:100%;margin-top:12px" onclick="finish()">トレーニング終了</button>`}
function toggle(id){openMap[id]=openMap[id]===false;render("training")}
function complete(id,i){if(!session)start();session.results[id]??={};session.results[id][i]??={};session.results[id][i].done=!session.results[id][i].done;save();if(session.results[id][i].done)startTimer(180);render("training")}
function edit(id,i,t){
  const r=result(id,i);
  modalRPE=(r.rpe ?? t.rpe ?? null);
  show(`<h3>SET ${i+1} 実績入力</h3>
    <label>重量 (kg)</label>
    <input id="ew" class="input" inputmode="decimal" type="number" step="0.1" value="${r.weight ?? ""}" placeholder="${t.weight ?? ""}">
    <label>レップ</label>
    <input id="er" class="input" inputmode="numeric" type="number" step="1" min="0" value="${r.reps ?? ""}" placeholder="${t.reps ?? ""}">
    <label>RPE</label>
    <div class="rpe">${Array.from({length:10},(_,n)=>`<button type="button" class="${modalRPE===n+1?"sel":""}" onclick="pickRPE(${n+1},this)">${n+1}</button>`).join("")}</div>
    <button class="primary" style="width:100%" onclick="saveEdit('${id}',${i})">実績を保存</button>`);
}
function pickRPE(n,btn){
  modalRPE=n;
  document.querySelectorAll(".rpe button").forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");
}
function saveEdit(id,i){
  if(!session) start();
  const weightValue=$("ew").value.trim();
  const repsValue=$("er").value.trim();
  const weight=weightValue===""?null:Number(weightValue);
  const reps=repsValue===""?null:Number(repsValue);
  if(weight!==null && !Number.isFinite(weight)){alert("重量を正しく入力してください");return}
  if(reps!==null && (!Number.isFinite(reps)||reps<0)){alert("レップを正しく入力してください");return}
  session.results[id]??={};
  session.results[id][i]={
    ...(session.results[id][i]||{}),
    weight,reps,rpe:modalRPE
  };
  save();
  closeModal();
  render("training");
}
function startTimer(sec){timerEnd=Date.now()+sec*1000;clearInterval(timerTick);timerTick=setInterval(timerUpdate,500);timerUpdate()}
function timerUpdate(){let el=$("timer");if(!timerEnd){el.classList.add("hidden");return}let x=Math.max(0,timerEnd-Date.now());if(!x){timerEnd=null;clearInterval(timerTick);el.classList.add("hidden");navigator.vibrate?.([150,80,150]);return}el.classList.remove("hidden");el.textContent=`${Math.floor(x/60000)}:${String(Math.floor(x/1000)%60).padStart(2,"0")}`}
function finish(){if(!session)return;session.completed=true;session.finishedAt=Date.now();let h=history();h.unshift(session);localStorage.setItem(HKEY,JSON.stringify(h));save();render("home")}
function schedule(m){m.innerHTML=`<h2>予定</h2><div class="list">${data.program.weeks.flatMap(w=>w.days.map(d=>`<div class="item"><b>W${w.week} D${d.day}</b><div class="muted">${d.exercises.length} 種目</div></div>`)).join("")}</div>`}
function historyView(m){let h=history();m.innerHTML=`<h2>履歴</h2>${h.length?`<div class="list">${h.map((x,i)=>`<div class="item"><b>${new Date(x.finishedAt||x.startedAt).toLocaleDateString("ja-JP")}</b><div class="muted">W${data.program.weeks[0].week} D${day().day}</div></div>`).join("")}</div>`:`<div class="empty">まだ履歴がありません</div>`}`}
function bbb(m){m.innerHTML=`<h2>BBB</h2><input class="input" placeholder="種目を検索" oninput="filterBBB(this.value)" style="margin-bottom:10px"><div id="bbblist" class="list">${data.bbb.exercise_master.map(x=>`<div class="item" data-n="${esc(x.name.toLowerCase())}"><b>${esc(x.name)}</b><div class="muted">${esc(x.category)} ・ ${esc(x.tags.join(" ・ "))}</div></div>`).join("")}</div>`}
function filterBBB(q){q=q.toLowerCase();document.querySelectorAll("#bbblist .item").forEach(x=>x.style.display=x.dataset.n.includes(q)?"block":"none")}
function settings(m){m.innerHTML=`<h2>設定</h2><div class="list"><div class="item">自動保存：ON</div><div class="item">タイマー：自動開始</div><div class="item">バックアップ：端末内データをエクスポート</div><div class="item"><button class="smallbtn" onclick="exportData()">データを書き出す</button></div><div class="item"><button class="smallbtn danger" onclick="clearSession()">進行中セッションを削除</button></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify({program:data,session,history:history()},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="workout-backup.json";a.click();URL.revokeObjectURL(a.href)}
function clearSession(){if(confirm("進行中のセッションを削除しますか？")){session=null;localStorage.removeItem(SKEY);render("home")}}
function show(x){$("sheet").innerHTML=x;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
$("back").onclick=()=>render("home");document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>render(b.dataset.v));
$("more").onclick=()=>show(`<h3>プログラム</h3><div class="muted">${esc(data.program.name)} / v${esc(data.program.version)}</div><p>現在のプログラムはインデックス方式で差し替え可能。</p>`);
loadSaved();render();
</script>
</body>
</html>
