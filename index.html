function home(m){const d=new Date(),date=d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});m.innerHTML=`<div class="hero"><div class="date">${date}</div><div class="wd">${session&&!session.completed?esc(session.week+' '+session.day):'Pre → BBB → PPP W1〜W8'}</div><button class="btn" style="margin-top:30px" onclick="${session&&!session.completed?"render('training')":"start()"}">${session&&!session.completed?'実施を再開':'トレーニング開始'}</button></div>`}
function schedule(m){const pre=Object.keys(DATA.PRE||{}).map(d=>`<div class="item"><b>Pre ${d}</b><span class="muted"> 初期キャリブレーション</span><button class="btn alt sm" style="float:right" onclick="start('PRE','${d}')">開始</button></div>`).join('');const weeks=Object.keys(DATA.PPP).map(w=>`<section class="card"><div class="head">${w}<span class="pill">${Object.keys(DATA.PPP[w]).length} Days</span></div><div class="body">${Object.keys(DATA.PPP[w]).map(d=>`<div class="item"><b>${d}</b> <span class="muted">${DATA.PPP[w][d].length}種目</span><button class="btn alt sm" style="float:right" onclick="start('${w}','${d}')">開始</button><button class="btn alt sm" style="float:right;margin-right:5px" onclick="editScheduleRest('${w}','${d}')">レスト</button></div>`).join('')}</div></section>`).join('');const bp=plans();const bbb=Object.keys(bp).map(c=>`<section class="card"><div class="head">BBB ${c} <span class="pill">${bp[c].reduce((a,x)=>a+x[1],0)}セット</span></div><div class="body"><button class="btn" onclick="start('BBB','${c}','BBB')">実施開始</button><button class="btn alt" onclick="editBBBPlan('${c}')">予定を編集</button><button class="btn alt" onclick="copyBBB('${c}')">コピー</button><button class="btn alt" onclick="editScheduleRest('BBB','${c}')">レスト</button></div></section>`).join('');m.innerHTML=`<h2>予定</h2><section class="card"><div class="head">Pre Week 1</div><div class="body">${pre}</div></section>${weeks}<h3 class="sectionTitle">BBB</h3>${bbb}`}
function editScheduleRest(w,d){const key=w+'_'+d,current=get('wl4_rest_'+key,settings().defaultRest),v=prompt('通常セットのレスト（秒）',current);if(v===null||!/^\d+(\.\d+)?$/.test(v))return;put('wl4_rest_'+key,Number(v));render('schedule')}
function training(m){if(!session){m.innerHTML='<div class="empty">実施中のセッションはありません。予定から開始してください。</div>';return}m.innerHTML=session.exercises.map((e,i)=>exercise(e,i)).join('')+`<section class="card"><div class="body"><label class="muted">セッション注釈</label><textarea class="input note" rows="3" oninput="session.notes.session=this.value;save()">${esc(session.notes.session)}</textarea><div class="controls"><button class="btn" onclick="finish()">トレーニング終了</button><button class="btn alt" onclick="addExercise()">＋ 種目追加</button></div></div></section>`}
function previousText(e){for(const h of historyData()){const p=h.exercises?.find(z=>z.name===e.name);if(p){const a=(p.sets||[]).map(s=>s.actual?.weight!=null?`${s.actual.weight}kg×${s.actual.reps??'—'}`:s.actual?.reps!=null?`${s.actual.reps}rep`: '').filter(Boolean).join(', ');if(a)return a}}return 'なし'}
function exercise(e,ei){const isOpen=openMap[e.id]!==false;let rows='';if(e.structure==='superset')rows=(e.children||[]).map((c,ci)=>`<div class="sub"><div class="subhead">${esc(c.name)} <button class="btn red tiny" onclick="removeChild('${esc(e.id)}',${ci})">削除</button></div>${c.sets.map((s,i)=>setRow(e.id+'_'+ci,i,s,'SET '+(i+1),e,ci,false)).join('')}<div class="controls"><button class="btn alt tiny" onclick="addChildSet('${esc(e.id)}',${ci})">＋ SET</button></div></div>`).join('');else if(e.structure==='drop')rows=setRow(e.id,0,e.sets[0],'MAIN',e,null,false)+(e.drops||[]).map((s,i)=>setRow(e.id+'_drop',i,s,'D'+(i+1),e,null,true)).join('');else rows=e.sets.map((s,i)=>setRow(e.id,i,s,(e.structure==='ascending'?'A':'SET ')+(i+1),e,null,false)).join('');let special=(session.program==='BBB')&&e.structure==='normal'?`<button class="btn alt sm" onclick="convertStructure('${esc(e.id)}','ascending')">ASCENDING化</button><button class="btn alt sm" onclick="convertStructure('${esc(e.id)}','drop')">DROP化</button><button class="btn alt sm" onclick="convertStructure('${esc(e.id)}','superset')">SUPERSET化</button>`:(session.program==='BBB'&&e.structure==='ascending')?`<button class="btn alt sm" onclick="addSet('${esc(e.id)}')">＋ SET</button><button class="btn alt sm" onclick="removeSet('${esc(e.id)}')">− SET</button>`:(session.program==='BBB'&&e.structure==='drop')?`<button class="btn alt sm" onclick="addDrop('${esc(e.id)}')">＋ DROP</button>`:(session.program==='BBB'?`<button class="btn alt sm" onclick="addChild('${esc(e.id)}')">＋ 子種目</button>`:'');return `<section class="card"><div class="head" onclick="toggleEx('${esc(e.id)}')"><span>${isOpen?'▼':'▶'} ${esc(e.name)} ${e.grip?'<span class="pill">'+esc(e.grip)+'</span>':''}</span><span class="tag">${esc(e.structure)}</span></div>${isOpen?`<div class="body"><div class="muted">目標：${esc(e.targetMeta?.intensity||'')} ${e.targetMeta?.rpe?'/ RPE '+esc(e.targetMeta.rpe):''}　｜　前回値：${esc(previousText(e))}</div>${rows}<div class="controls">${special}<button class="btn alt sm" onclick="editRest('${esc(e.id)}')">レスト ${e.rest}s</button>${session.program==='BBB'?`<button class="btn alt sm" onclick="changeBBBExercise('${esc(e.id)}')">当日種目変更</button>`:''}${session.program==='BBB'?`<button class="btn red sm" onclick="removeExercise('${esc(e.id)}')">種目削除</button>`:''}</div><textarea class="input note" rows="2" placeholder="種目注釈" oninput="eById('${esc(e.id)}').note=this.value;save()">${esc(e.note)}</textarea></div>`:''}</section>`}
function eById(id){return session.exercises.find(e=>e.id===id)}
function toggleEx(id){openMap[id]=openMap[id]===false;saveOpen();render('training')}
function locateSet(id,i){if(id.endsWith('_drop')){const base=id.slice(0,-5),e=eById(base);return [e,e?.drops?.[i],true]}for(const e of session.exercises){if(e.id===id)return [e,e.sets[i],false];for(let ci=0;ci<(e.children||[]).length;ci++)if(e.id+'_'+ci===id)return [e,e.children[ci].sets[i],false]}return [null,null,false]}
function setRow(id,i,s,label,parent,ci,isDrop){const a=s.actual||{},t=s.target||{};return `<div class="row ${a.done?'done':''}"><button class="cell" onclick="toggleDone('${esc(id)}',${i})">${a.done?'☑':'☐'}</button><button class="cell" onclick="editSet('${esc(id)}',${i})">${a.weight!=null?esc(a.weight):esc(t.weight||'—')} <small class="muted">kg</small></button><button class="cell" onclick="editSet('${esc(id)}',${i})">${a.reps!=null?esc(a.reps):esc(t.reps||'—')} rep${a.rpe!=null?' / @'+esc(a.rpe):''}</button><span class="tag">${label}</span></div>`}
function toggleDone(id,i){const [e,s,isDrop]=locateSet(id,i);if(!s)return;s.actual.done=!s.actual.done;save();if(s.actual.done&&!isDrop&&e.structure!=='superset')startTimer(e.rest,`${e.name} SET ${i+1}`);render('training')}
function editSet(id,i){const [e,s]=locateSet(id,i);if(!s)return;editCtx={e,s,i,id};const a=s.actual||{},t=s.target||{};pickedR=a.rpe??null;$('sheetBody').innerHTML=`<h3>${esc(e.name)} / SET ${i+1}</h3><div class="grid2"><div><label>重量 (kg)</label><input id="ew" class="input" type="number" step="0.1" inputmode="decimal" value="${a.weight??''}" placeholder="${esc(t.weight||'')}"></div><div><label>レップ</label><input id="er" class="input" type="number" step="1" min="0" inputmode="numeric" value="${a.reps??''}" placeholder="${esc(t.reps||'')}"></div></div><label>RPE</label><div class="rpes">${Array.from({length:10},(_,n)=>`<button class="${pickedR===n+1?'sel':''}" onclick="pickR(${n+1})">${n+1}</button>`).join('')}</div><label>セット注釈</label><textarea id="en" class="input" rows="2">${esc(s.note||'')}</textarea><div class="controls"><button class="btn" onclick="saveSet()">保存</button><button class="btn alt" onclick="closeSheet()">閉じる</button></div>`;$('sheet').classList.remove('hidden')}
function pickR(n){pickedR=n;document.querySelectorAll('.rpes button').forEach((b,i)=>b.classList.toggle('sel',i+1===n))}
function saveSet(){const a=editCtx.s.actual;a.weight=$('ew').value===''?null:Number($('ew').value);a.reps=$('er').value===''?null:Number($('er').value);a.rpe=pickedR;editCtx.s.note=$('en').value;save();closeSheet();render('training')}
function closeSheet(){$('sheet').classList.add('hidden');pickedR=null}
function addSet(id){const e=eById(id);if(!e)return;const last=e.sets[e.sets.length-1]||newSet();e.sets.push(newSet(clone(last.target)));save();render('training')}
function removeSet(id){const e=eById(id);if(!e||e.sets.length<=1)return;if(confirm('最後のSET以外を含めて削除しますか？')){e.sets.pop();save();render('training')}}
function convertStructure(id,type){const e=eById(id);if(!e)return;e.structure=type;if(type==='drop'){e.drops=e.drops||[]}if(type==='superset'){e.children=e.children||[];if(!e.children.length)e.children.push({id:crypto.randomUUID(),name:'子種目1',sets:[newSet()],note:''})}save();render('training')}
function addDrop(id){const e=eById(id);if(!e)return;e.drops=e.drops||[];const base=e.drops.at(-1)||e.sets[0];e.drops.push(newSet(clone(base?.target||{})));save();render('training')}
function removeDrop(id,i){const e=eById(id);if(!e?.drops)return;e.drops.splice(i,1);save();render('training')}
function addChild(id){const e=eById(id);if(!e)return;const name=prompt('子種目名');if(!name)return;e.children.push({id:crypto.randomUUID(),name,sets:[newSet()],note:''});save();render('training')}
function removeChild(id,i){const e=eById(id);if(!e)return;e.children.splice(i,1);save();render('training')}
function addChildSet(id,ci){const e=eById(id),c=e?.children?.[ci];if(!c)return;const last=c.sets.at(-1)||newSet();c.sets.push(newSet(clone(last.target)));save();render('training')}
function removeChildSet(id,ci,si){const e=eById(id),c=e?.children?.[ci];if(!c||c.sets.length<=1)return;c.sets.splice(si,1);save();render('training')}
function editRest(id){const e=eById(id),v=prompt('通常セットのレスト（秒）',e?.rest);if(v===null||!/^\d+(\.\d+)?$/.test(v))return;if(e){e.rest=Number(v);save();render('training')}}
function addExercise(){const name=prompt('種目名');if(!name)return;const allowed=DATA.COMMON_MASTER.includes(name)||DATA.BBB_MASTER.includes(name);if(!allowed&&!confirm('マスターにない種目です。追加しますか？'))return;session.exercises.push({id:crypto.randomUUID(),name,structure:'normal',sets:[newSet()],rest:settings().defaultRest,note:'',drops:[],children:[],targetMeta:{}});save();render('training')}
function changeBBBExercise(id){const e=eById(id);if(!e||session.program!=='BBB')return;openMaster('BBB当日種目変更',name=>{const src=Object.values(plans()).flat().find(x=>x[0]===name);e.name=name;if(src)e.sets=Array.from({length:src[1]},()=>newSet({reps:src[2]||''}));save();render('training')})}
function removeExercise(id){if(session.program!=='BBB')return;if(!confirm('この種目を実施から削除しますか？'))return;session.exercises=session.exercises.filter(e=>e.id!==id);save();render('training')}
function editBBBPlan(cat){openBBBPlanEditor(cat)}
function openBBBPlanEditor(cat){const p=plans(),arr=p[cat]||[];$('sheetBody').innerHTML=`<h3>BBB予定：${esc(cat)}</h3><div class="muted">予定変更はBBB計画だけを変更。過去の履歴・実施データは変更しません。</div><div id="bbbeditor">${arr.map((x,i)=>`<div class="item"><b>${esc(x[0])}</b><div class="muted">${x[1]}セット / ${esc(x[2]||'当日調整')}</div><div class="controls"><button class="btn alt tiny" onclick="editBBBItem('${esc(cat)}',${i})">変更</button><button class="btn red tiny" onclick="deleteBBBItem('${esc(cat)}',${i})">削除</button><button class="btn alt tiny" onclick="moveBBBItem('${esc(cat)}',${i},-1)">↑</button><button class="btn alt tiny" onclick="moveBBBItem('${esc(cat)}',${i},1)">↓</button></div></div>`).join('')}</div><div class="controls"><button class="btn" onclick="addBBBItem('${esc(cat)}')">＋ 種目</button><button class="btn alt" onclick="closeSheet()">閉じる</button></div>`;$('sheet').classList.remove('hidden')}
function addBBBItem(cat){const name=prompt('種目名（BBBマスターから）');if(!name||!DATA.BBB_MASTER.includes(name))return alert('BBB種目マスターから選択してください。');const sets=Number(prompt('セット数','1'));if(!Number.isInteger(sets)||sets<1)return;const reps=prompt('目標rep域（未設定可）','');const p=plans();p[cat].push([name,sets,reps||'']);savePlans(p);openBBBPlanEditor(cat)}
function editBBBItem(cat,i){const p=plans(),x=p[cat][i],name=prompt('種目名',x[0]);if(name===null)return;if(!DATA.BBB_MASTER.includes(name))return alert('BBB種目マスターから選択してください。');const sets=Number(prompt('セット数',x[1]));if(!Number.isInteger(sets)||sets<1)return;const reps=prompt('目標rep域（未設定可）',x[2]||'');p[cat][i]=[name,sets,reps||''];savePlans(p);openBBBPlanEditor(cat)}
function deleteBBBItem(cat,i){const p=plans();if(confirm('予定から削除しますか？')){p[cat].splice(i,1);savePlans(p);openBBBPlanEditor(cat)}}
function moveBBBItem(cat,i,d){const p=plans(),j=i+d;if(j<0||j>=p[cat].length)return;[p[cat][i],p[cat][j]]=[p[cat][j],p[cat][i]];savePlans(p);openBBBPlanEditor(cat)}
function copyBBB(cat){const p=plans(),to=prompt('コピー先カテゴリ',cat);if(!to||!p[to])return;p[to]=p[to].concat(clone(p[cat]));savePlans(p)}
function bbb(m){const p=plans();const totals=Object.fromEntries(Object.entries(p).map(([c,a])=>[c,a.reduce((n,x)=>n+x[1],0)]));m.innerHTML=`<h2>BBB</h2><div class="warn">現行正本：週間210セット。肩は正本の「45セット」に対し列挙種目の合計が43セットのため、2セットを勝手に捏造せず警告として保持しています。</div><input id="bq" class="input" placeholder="種目を検索" oninput="filterBBB()">${Object.keys(p).map(c=>`<section class="card"><div class="head">${c} <span class="pill">${totals[c]}セット</span></div><div class="body">${p[c].map((x,i)=>`<div class="item bitem" data-n="${esc(x[0].toLowerCase())}"><b>${esc(x[0])}</b><div class="muted">${x[1]}セット / ${esc(x[2]||'当日調整')}</div><div class="controls"><button class="btn sm" onclick="startBBB('${esc(c)}')">実施</button><button class="btn alt sm" onclick="openBBBPlanEditor('${esc(c)}')">変更</button></div></div>`).join('')}</div></section>`).join('')}</div>`}
function filterBBB(){const q=($('bq')?.value||'').toLowerCase();document.querySelectorAll('.bitem').forEach(x=>x.style.display=x.dataset.n.includes(q)?'block':'none')}
function startBBB(cat){start('BBB',cat,'BBB')}
function openMaster(title,onPick){const all=DATA.BBB_MASTER;$('sheetBody').innerHTML=`<h3>${esc(title)}</h3><input id="mq" class="input" placeholder="検索" oninput="filterMaster()"><div class="master" id="masterList">${all.map(n=>`<div class="item mitem" data-n="${esc(n.toLowerCase())}"><span>${esc(n)}</span><button class="btn alt tiny" onclick="pickMaster('${esc(n)}')">選択</button></div>`).join('')}</div><button class="btn alt" onclick="closeSheet()">閉じる</button>`;$('sheet').classList.remove('hidden');window._pickMaster=onPick}
function filterMaster(){const q=($('mq')?.value||'').toLowerCase();document.querySelectorAll('.mitem').forEach(x=>x.style.display=x.dataset.n.includes(q)?'flex':'none')}
function pickMaster(n){const f=window._pickMaster;closeSheet();if(f)f(n)}
function finish(){if(!session)return;const incomplete=[];session.exercises.forEach(e=>{(e.sets||[]).forEach((s,i)=>{if(!s.actual?.done)incomplete.push(e.name+' SET '+(i+1))});(e.drops||[]).forEach((s,i)=>{if(!s.actual?.done)incomplete.push(e.name+' D'+(i+1))});(e.children||[]).forEach(c=>(c.sets||[]).forEach((s,i)=>{if(!s.actual?.done)incomplete.push(c.name+' SET '+(i+1))}))});if(incomplete.length&&!confirm('未完了セットがあります。終了しますか？'))return;if(session.editingHistory!=null){const h=historyData();const i=session.editingHistory;const copy=clone(session);copy.completed=true;copy.editingHistory=null;h[i]=copy;put(HK,h);session=null;localStorage.removeItem(K);render('history');return}session.completed=true;session.finishedAt=Date.now();const h=historyData();h.unshift(clone(session));put(HK,h);session=null;localStorage.removeItem(K);render('home')}
function historyView(m){const h=historyData();if(!h.length){m.innerHTML='<div class="empty">履歴はまだありません。</div>';return}const groups={};h.forEach((x,i)=>{const d=new Date(x.finishedAt||x.startedAt),k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;(groups[k]??=[]).push([x,i])});m.innerHTML='<h2>履歴</h2>'+Object.entries(groups).map(([k,a])=>`<section class="card"><div class="head" onclick="this.nextElementSibling.classList.toggle('hidden')">${k} <span class="pill">${a.length}件</span></div><div class="body">${a.map(([x,i])=>`<div class="item" onclick="historyDetail(${i})"><b>${new Date(x.finishedAt||x.startedAt).toLocaleDateString('ja-JP')}</b>　${esc(x.week)} ${esc(x.day)} <span class="muted">${esc(x.program)}</span></div>`).join('')}</div></section>`).join('')}
function historyDetail(i){const x=historyData()[i];if(!x)return;const prev=findPreviousHistory(x,i);let html=`<h3>${new Date(x.finishedAt||x.startedAt).toLocaleDateString('ja-JP')}　${esc(x.week)} ${esc(x.day)}</h3><div class="muted">目標・前回値・実績は別管理。履歴から実績のみ修正できます。</div>`;x.exercises.forEach(e=>{html+=`<div class="sub"><div class="subhead">${esc(e.name)} <span class="tag">${esc(e.structure)}</span></div><div class="muted" style="padding:8px">前回値：${esc(prev?.exercises?.find(z=>z.name===e.name)?previousTextFrom(prev,e.name):'なし')}</div>${(e.sets||[]).map((s,j)=>`<div class="item">SET ${j+1}：目標 ${esc(s.target?.weight||'—')}kg × ${esc(s.target?.reps||'—')} / 実績 ${s.actual?.weight??'—'}kg × ${s.actual?.reps??'—'} ${s.actual?.rpe!=null?'@'+s.actual.rpe:''} ${s.actual?.done?'✓':''} ${s.note?' / '+esc(s.note):''}</div>`).join('')}${(e.drops||[]).map((s,j)=>`<div class="item">D${j+1}：実績 ${s.actual?.weight??'—'}kg × ${s.actual?.reps??'—'} ${s.actual?.rpe!=null?'@'+s.actual.rpe:''}</div>`).join('')}${(e.children||[]).map(c=>`<div class="sub"><div class="subhead">${esc(c.name)}</div>${(c.sets||[]).map((s,j)=>`<div class="item">SET ${j+1}：実績 ${s.actual?.weight??'—'}kg × ${s.actual?.reps??'—'} ${s.actual?.rpe!=null?'@'+s.actual.rpe:''}</div>`).join('')}</div>`).join('')}</div>`});html+=`<div class="item"><b>セッション注釈：</b>${esc(x.notes?.session||'')}</div><div class="controls"><button class="btn" onclick="editHistory(${i})">実績修正</button><button class="btn alt" onclick="shareHistory(${i})">共有</button><button class="btn red" onclick="deleteHistory(${i})">完全削除</button><button class="btn alt" onclick="closeSheet()">閉じる</button></div>`;$('sheetBody').innerHTML=html;$('sheet').classList.remove('hidden')}
function findPreviousHistory(x,i){const h=historyData();for(let j=i+1;j<h.length;j++)if(h[j].program===x.program&&h[j].day===x.day)return h[j];return null}
function previousTextFrom(h,name){const e=h?.exercises?.find(z=>z.name===name);if(!e)return'なし';return (e.sets||[]).map(s=>s.actual?.weight!=null?`${s.actual.weight}kg×${s.actual.reps??'—'}`:'').filter(Boolean).join(', ')||'なし'}
function editHistory(i){const h=historyData(),x=h[i];if(!x)return;session=clone(x);session.completed=true;session.editingHistory=i;save();closeSheet();render('training')}
function deleteHistory(i){if(!confirm('この履歴を完全に削除しますか？'))return;const h=historyData();h.splice(i,1);put(HK,h);closeSheet();render('history')}
function shareHistory(i){const x=historyData()[i];if(!x)return;const text=`${new Date(x.finishedAt||x.startedAt).toLocaleDateString('ja-JP')} ${x.week} ${x.day}\n`+x.exercises.map(e=>e.name+': '+(e.sets||[]).map(s=>`${s.actual?.weight??'—'}kg×${s.actual?.reps??'—'}${s.actual?.rpe!=null?' @'+s.actual.rpe:''}`).join(' / ')).join('\n')+`\n注釈：${x.notes?.session||''}`;if(navigator.share)navigator.share({title:'Workout Log',text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>alert('共有用テキストをコピーしました。'))}
function settingsView(m){const s=settings();m.innerHTML=`<h2>設定</h2><section class="card"><div class="item">自動保存：ON</div><div class="item">RPE：1〜10選択式 / 未設定可</div><div class="item">重量単位：${esc(s.weightUnit)}</div><div class="item"><button class="btn alt" onclick="toggleSetting('sound')">終了音：${s.sound?'ON':'OFF'}</button> <button class="btn alt" onclick="toggleSetting('vibrate')">バイブ：${s.vibrate?'ON':'OFF'}</button></div><div class="item"><button class="btn alt" onclick="setDefaultRest()">標準レスト変更</button></div><div class="item"><button class="btn" onclick="exportData()">エクスポート</button> <button class="btn alt" onclick="importDataPrompt()">インポート</button></div><div class="item"><button class="btn alt" onclick="restoreAutoBackup()">自動バックアップ復元</button></div><div class="item"><button class="btn red" onclick="clearSession()">進行中セッション削除</button></div></section>`}
function toggleSetting(k){const s=settings();s[k]=!s[k];put(SETK,s);render('settings')}
function setDefaultRest(){const s=settings(),v=prompt('標準レスト（秒）',s.defaultRest);if(v===null||!/^\d+$/.test(v))return;s.defaultRest=Number(v);put(SETK,s);render('settings')}
function exportData(){const payload={schema_version:'4.0',program:DATA,session,history:historyData(),plans:plans(),settings:settings(),timer:timerState()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workout-log-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importDataPrompt(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!confirm('現在データを自動バックアップしてから復元します。続行しますか？'))return;put('wl4_autobackup',{session:clone(session),history:historyData(),plans:plans(),settings:settings(),timer:timerState(),savedAt:Date.now()});if(x.session)put(K,x.session);if(Array.isArray(x.history))put(HK,x.history);if(x.plans)put(PK,x.plans);if(x.settings)put(SETK,x.settings);if(x.timer)put(TK,x.timer);load();restoreTimer();render('home');alert('復元しました。')}catch(e){alert('バックアップ形式を読み込めません。')}};r.readAsText(f)};input.click()}
function restoreAutoBackup(){const x=get('wl4_autobackup',null);if(!x)return alert('自動バックアップがありません。');if(!confirm('自動バックアップを現在データへ復元しますか？'))return;if(x.session)put(K,x.session);put(HK,x.history||[]);put(PK,x.plans||clone(DATA.BBB));put(SETK,x.settings||settings());if(x.timer)put(TK,x.timer);load();restoreTimer();render('home')}
function clearSession(){if(confirm('進行中セッションを削除しますか？')){session=null;localStorage.removeItem(K);render('home')}}
function timerState(){return {end:timerEnd,meta:timerMeta}}
function restoreTimer(){const x=get(TK,null);if(x?.end&&x.end>Date.now()){timerEnd=x.end;timerMeta=x.meta||{};clearInterval(timerTick);timerTick=setInterval(timerUI,500);timerUI()}else if(x){localStorage.removeItem(TK);timerEnd=0;timerMeta={}}}
function startTimer(sec,label=''){if(!sec||sec<1)return;timerEnd=Date.now()+Number(sec)*1000;timerMeta={kind:'normal',label,rest:Number(sec)};put(TK,timerState());clearInterval(timerTick);timerTick=setInterval(timerUI,500);timerUI()}
function adjustTimer(sec){if(timerEnd){timerEnd=Math.max(Date.now(),timerEnd+sec*1000);put(TK,timerState())}timerUI()}
function resetTimer(){timerEnd=0;timerMeta={};clearInterval(timerTick);localStorage.removeItem(TK);timerUI()}
function timerUI(){const el=$('timer');if(!timerEnd){el.classList.add('hidden');return}const rem=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if(rem<=0){el.classList.add('hidden');clearInterval(timerTick);timerEnd=0;timerMeta={};localStorage.removeItem(TK);const s=settings();if(s.sound)try{const C=window.AudioContext||window.webkitAudioContext;if(C){const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.25)}}catch(e){}if(s.vibrate&&navigator.vibrate)navigator.vibrate([180,80,180]);return}el.classList.remove('hidden');const mm=String(Math.floor(rem/60)).padStart(2,'0'),ss=String(rem%60).padStart(2,'0');el.innerHTML=`<b>${mm}:${ss}</b><span>${esc(timerMeta.label||'休憩')}</span><button onclick="adjustTimer(30)">+30</button><button onclick="adjustTimer(-30)">−30</button><button onclick="resetTimer()">↺</button>`}
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){load();restoreTimer();render(view)}});window.addEventListener('beforeunload',e=>{if(session&&!session.completed){save();e.preventDefault();e.returnValue=''}});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.v));load();restoreTimer();render();
</script></body></html>
